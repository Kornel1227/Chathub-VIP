<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <title>ChathubVIP</title>
</head>
<body>
    <header>
        <div id="header_">
            <img src="../../Képek/Képernyőfelvétel (21).png" alt="Logó" id="h_logo">
            <div id="valassz">
                <h1 id="Valasztek">
                    Külföldi Hölgyek
                </h1>
                <h1 id="Valasztek">
                    Külföldi Férfiak
                </h1>
                <h1 id="Valasztek">
                    Magyar Hölgyek
                </h1>
                <h1 id="Valasztek">
                    Magyar Férfiak
                </h1>
                <h1 id="ValasztekKapcsolat">
                    Kapcsolat
                </h1>
            </div>
        </div> 
    </header>
    <div id="alekoszdiv">
        <video controls loop width="550" height="800">
            <source src="alekoszvideo.mp4" type="video/mp4">
        </video>
    </div>
    <div id="slidediv">
        <div class="slideshow-container">

            <div class="mySlides fade">
              <img src="../../Képek/madelyn_cline.png" style="width:100%">
              <div class="text">Caption Text</div>
            </div>
            
            <div class="mySlides fade">
              <img src="../../Képek/letöltésLJ.png" style="width:100%">
              <div class="text">Caption Two</div>
            </div>
            
            <div class="mySlides fade">
              <img src="../../Képek/alekosz.png" style="width:100%">
              <div class="text">Caption Three</div>
            </div>
            
            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>
            
            </div> 
    </div>
    <div id="madelyndiv">
      <video controls loop width="550" height="800">
          <source src="madelynclinevideo.mp4" type="video/mp4">
      </video>
  </div>
  
 
</body>
<script>
    let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}
</script>
</html>
